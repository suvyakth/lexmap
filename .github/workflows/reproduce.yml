name: reproduce
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Rebuild every output from cached model calls (no API key, no network LLM)
        env:
          LEXMAP_LLM_BACKEND: cache-only
          PYTHONIOENCODING: utf-8
        run: python run.py --extract
      - name: Outputs are byte-identical to the committed submission
        run: git diff --exit-code -- submission/rules.json submission/lookups.json submission/changes.json
      - name: Unit and end-to-end tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Browser engine matches Python engine
        run: node tests/parity.js
